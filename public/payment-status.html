<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status | Expense Tracker</title>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }
        .payment-card {
            width: min(520px, 100%);
            padding: 40px 32px;
            text-align: center;
            background: var(--card-bg, #fff);
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }
        #paymentStatusIcon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 38px;
            font-weight: 700;
            background: #eee;
        }
        h1 { margin: 0 0 12px; }
        p { line-height: 1.6; }
        .actions { display: flex; gap: 12px; justify-content: center; margin-top: 28px; }
        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
        }
        #paymentRetryButton { background: #2563eb; color: white; }
        #paymentDashboardButton { background: #e5e7eb; color: #111827; }
        [hidden] { display: none !important; }
        body[data-status="success"] #paymentStatusIcon { background: #dcfce7; color: #15803d; }
        body[data-status="failed"] #paymentStatusIcon { background: #fee2e2; color: #b91c1c; }
        body[data-status="pending"] #paymentStatusIcon { background: #fef3c7; color: #a16207; }
    </style>
</head>
<body>
    <main class="payment-card" aria-live="polite">
        <div id="paymentStatusIcon">…</div>
        <h1 id="paymentStatusTitle">Verifying your payment…</h1>
        <p id="paymentStatusMessage">Please wait.</p>
        <div class="actions">
            <button id="paymentRetryButton" hidden>Check Again</button>
            <button id="paymentDashboardButton">Back to Dashboard</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
    <script src="js/apiConfig.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/payment-status.js"></script>
</body>
</html>
